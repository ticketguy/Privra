user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - Admin interface
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        ssl_certificate /etc/ssl/mail/fullchain.pem;
        ssl_certificate_key /etc/ssl/mail/privkey.pem;

        # Webmail interface
        location = /mail {
            return 301 /mail/;
        }

        location /mail/ {
            proxy_pass http://webmail:5001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin interface
        location / {
            proxy_pass http://admin:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# Stream proxy for mail ports (TCP passthrough with SSL)
stream {
    # SMTP submission (port 587) with STARTTLS
    server {
        listen 587;
        listen [::]:587;
        proxy_pass postfix:587;
        proxy_timeout 10m;
        proxy_connect_timeout 10s;
    }

    # SMTP (port 25) for server-to-server mail
    server {
        listen 25;
        listen [::]:25;
        proxy_pass postfix:25;
        proxy_timeout 10m;
        proxy_connect_timeout 10s;
    }

    # IMAP with SSL (port 993)
    server {
        listen 993;
        listen [::]:993;
        proxy_pass dovecot:993;
        proxy_timeout 10m;
        proxy_connect_timeout 10s;
    }
}
