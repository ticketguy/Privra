services:
  # PostgreSQL - User database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-privramail}
      POSTGRES_USER: ${DB_USER:-privramail}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mailnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-privramail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Session storage
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postfix - SMTP server
  postfix:
    build: ./postfix
    restart: always
    hostname: ${MAIL_HOSTNAME}
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-privramail}
      - DB_USER=${DB_USER:-privramail}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - mail-queue:/var/spool/postfix
      - mail-storage:/var/mail
      - dkim-keys:/etc/opendkim/keys
      - ./certs:/etc/ssl/mail:ro
    networks:
      - mailnet
    depends_on:
      db:
        condition: service_healthy

  # Dovecot - IMAP server
  dovecot:
    build: ./dovecot
    restart: always
    hostname: ${MAIL_HOSTNAME}
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-privramail}
      - DB_USER=${DB_USER:-privramail}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - mail-storage:/var/mail
      - ./certs:/etc/ssl/mail:ro
    networks:
      - mailnet
    depends_on:
      db:
        condition: service_healthy

  # Admin - Web interface
  admin:
    build: ./admin
    restart: always
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-privramail}
      - DB_USER=${DB_USER:-privramail}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORTID_APP_ID=${PORTID_APP_ID:-privra-mail-v1}
      - PORTID_API_URL=${PORTID_API_URL:-http://localhost:5001}
    volumes:
      - ./admin:/app
    networks:
      - mailnet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Webmail - Email client interface
  webmail:
    build:
      context: .
      dockerfile: webmail/Dockerfile
    restart: always
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - IMAP_HOST=dovecot
      - IMAP_PORT=993
      - SMTP_HOST=postfix
      - SMTP_PORT=587
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-privramail}
      - DB_USER=${DB_USER:-privramail}
      - DB_PASSWORD=${DB_PASSWORD}
      - PORTID_APP_ID=${PORTID_APP_ID:-privra-mail-v1}
      - PORTID_API_URL=${PORTID_API_URL:-http://localhost:5001}
    networks:
      - mailnet
    depends_on:
      db:
        condition: service_healthy
      dovecot:
        condition: service_started
      postfix:
        condition: service_started

  # Nginx - SSL termination & reverse proxy
  nginx:
    build: ./nginx
    restart: always
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - WEBMAIL_HOSTNAME=${WEBMAIL_HOSTNAME:-mail.${MAIL_DOMAIN}}
      - ADMIN_HOSTNAME=${ADMIN_HOSTNAME:-admin.${MAIL_DOMAIN}}
    ports:
      - "80:80"
      - "443:443"
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - ./certs:/etc/ssl/mail:ro
    networks:
      - mailnet
    depends_on:
      - postfix
      - dovecot
      - admin

networks:
  mailnet:
    driver: bridge

volumes:
  db-data:
  redis-data:
  mail-storage:
  mail-queue:
  dkim-keys:
