version: '3.8'

services:
  # PostgreSQL - User database
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-privramail}
      POSTGRES_USER: ${DB_USER:-privramail}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - mailnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-privramail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Session storage
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - mailnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Postfix - SMTP server
  postfix:
    build: ./postfix
    restart: always
    hostname: ${MAIL_HOSTNAME}
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-privramail}
      - DB_USER=${DB_USER:-privramail}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - mail-queue:/var/spool/postfix
      - ./certs:/etc/ssl/mail:ro
    networks:
      - mailnet
    depends_on:
      db:
        condition: service_healthy

  # Dovecot - IMAP server
  dovecot:
    build: ./dovecot
    restart: always
    hostname: ${MAIL_HOSTNAME}
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - MAIL_HOSTNAME=${MAIL_HOSTNAME}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-privramail}
      - DB_USER=${DB_USER:-privramail}
      - DB_PASSWORD=${DB_PASSWORD}
    volumes:
      - mail-storage:/var/mail
      - ./certs:/etc/ssl/mail:ro
    networks:
      - mailnet
    depends_on:
      db:
        condition: service_healthy

  # Admin - Web interface
  admin:
    build: ./admin
    restart: always
    environment:
      - MAIL_DOMAIN=${MAIL_DOMAIN}
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_NAME=${DB_NAME:-privramail}
      - DB_USER=${DB_USER:-privramail}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./admin:/app
    networks:
      - mailnet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Nginx - SSL termination & reverse proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "25:25"
      - "587:587"
      - "993:993"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/mail:ro
    networks:
      - mailnet
    depends_on:
      - postfix
      - dovecot
      - admin

networks:
  mailnet:
    driver: bridge

volumes:
  db-data:
  redis-data:
  mail-storage:
  mail-queue:
