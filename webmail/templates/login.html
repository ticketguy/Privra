{% extends "base_auth.html" %}

{% block title %}Login - Privra Webmail{% endblock %}

{% block content %}
<style>
    .login-container {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        position: relative;
        overflow: hidden;
    }

    /* Animated liquid gradient background */
    .login-container::before {
        content: '';
        position: absolute;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 20% 50%, rgba(118, 75, 162, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 80% 80%, rgba(102, 126, 234, 0.15) 0%, transparent 50%),
                    radial-gradient(circle at 40% 20%, rgba(240, 147, 251, 0.1) 0%, transparent 50%);
        animation: gradientShift 15s ease infinite;
        z-index: 0;
    }

    @keyframes gradientShift {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(-5%, -5%) rotate(60deg); }
        66% { transform: translate(5%, 5%) rotate(-60deg); }
    }

    .login-card {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(118, 75, 162, 0.2),
                    inset 0 1px 1px rgba(255, 255, 255, 0.1);
        max-width: 440px;
        width: 100%;
        padding: 3rem 2.5rem;
        border: 1px solid var(--glass-border);
        position: relative;
        z-index: 1;
        overflow: hidden;
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
        animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
        0% { left: -100%; }
        100% { left: 100%; }
    }

    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .login-logo {
        font-size: 3rem;
        margin-bottom: 1rem;
    }

    .login-title {
        font-size: 1.75rem;
        font-weight: 600;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 0.5rem;
    }

    .login-subtitle {
        color: var(--text-light);
        font-size: 0.95rem;
    }

    .login-form .form-group {
        margin-bottom: 1.5rem;
    }

    .login-form label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.5rem;
        color: var(--text-dark);
        font-size: 0.9rem;
    }

    .login-form input[type="email"],
    .login-form input[type="password"] {
        width: 100%;
        padding: 0.85rem 1rem;
        border: 2px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
        transition: all 0.3s ease;
        background: var(--bg-main);
        color: var(--text-dark);
    }

    .login-form input[type="email"]:focus,
    .login-form input[type="password"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
    }

    .login-btn {
        width: 100%;
        padding: 0.95rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 0.5rem;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
    }

    .login-divider {
        text-align: center;
        margin: 2rem 0 1.5rem;
        padding-top: 2rem;
        border-top: 1px solid var(--border);
        color: var(--text-light);
        font-size: 0.9rem;
    }

    .register-btn {
        width: 100%;
        padding: 0.95rem;
        font-size: 1rem;
        font-weight: 600;
        border: 2px solid var(--primary);
        border-radius: 8px;
        background: transparent;
        color: var(--primary);
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: block;
        text-align: center;
    }

    .register-btn:hover {
        background: var(--primary);
        color: white;
        transform: translateY(-2px);
    }
</style>

<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">✉️</div>
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to access your Privra Mail</p>
        </div>

        <form method="POST" class="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required autofocus placeholder="you@privra.xyz">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="login-divider">
            Don't have an account?
        </div>

        <a href="{{ url_for('register') }}" class="register-btn">Create New Account</a>
    </div>
</div>
{% endblock %}
