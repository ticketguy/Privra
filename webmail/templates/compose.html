{% extends "base.html" %}

{% block title %}Compose Email - Privra Webmail{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom: 1.5rem;">Compose New Email</h2>
    <form method="POST">
        <div class="form-group">
            <label for="to">To</label>
            <input type="email" id="to" name="to" required placeholder="recipient@example.com">
        </div>
        <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required placeholder="Email subject">
        </div>
        <div class="form-group">
            <label for="body">Message</label>
            <textarea id="body" name="body" placeholder="Write your message here..."></textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">Send Email</button>
            <a href="{{ url_for('inbox') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
