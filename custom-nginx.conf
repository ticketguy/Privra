# Custom nginx configuration for Mailu front container
# This bypasses the broken Jinja2 template

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Upstream services
    upstream admin {
        server admin:80;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name mail.privra.xyz;

        location /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name mail.privra.xyz;

        ssl_certificate /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        # Admin interface
        location /admin {
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root redirect to admin
        location = / {
            return 301 https://$host/admin;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

# Mail proxy configuration
mail {
    server_name mail.privra.xyz;
    auth_http http://admin:8000/internal/auth/email;

    proxy_pass_error_message on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_certificate /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;

    # SMTP
    server {
        listen 25;
        listen [::]:25;
        protocol smtp;
        smtp_auth none;
    }

    server {
        listen 587;
        listen [::]:587;
        protocol smtp;
        starttls on;
    }

    server {
        listen 465 ssl;
        listen [::]:465 ssl;
        protocol smtp;
    }

    # IMAP
    server {
        listen 143;
        listen [::]:143;
        protocol imap;
        starttls on;
    }

    server {
        listen 993 ssl;
        listen [::]:993 ssl;
        protocol imap;
    }

    # POP3
    server {
        listen 110;
        listen [::]:110;
        protocol pop3;
        starttls on;
    }

    server {
        listen 995 ssl;
        listen [::]:995 ssl;
        protocol pop3;
    }
}
